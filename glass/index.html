<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Block Video</title>
<meta name="description" content="Put a refractive glass-block texture over any video, image or webcam feed and export it as a video.">
<style>
  :root{
    --bg:#0e0f11; --panel:#16181b; --panel2:#1d2024; --line:#2a2e33; --text:#e9eaec; --dim:#9aa0a7;
    --accent:#d8f36a; --accent-ink:#151a05; --danger:#ff6b5e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{display:grid;grid-template-columns:1fr 340px;height:100vh}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;min-height:0;
    background:radial-gradient(circle at 50% 40%,#1a1c20,#0b0c0d 70%)}
  .stage canvas{max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px;background:#000}
  .stage.drag::after{content:"Drop video or image";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,.6);color:var(--accent)}
  .hud{position:absolute;left:20px;bottom:16px;right:20px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .hud>*{pointer-events:auto}
  .pill{background:rgba(20,22,25,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--dim)}
  .rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;display:none}
  .progress i{display:block;height:100%;width:0;background:var(--danger)}

  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  header{padding:16px 16px 10px}
  header h1{margin:0;font-size:16px;letter-spacing:.2px}
  header p{margin:4px 0 0;color:var(--dim);font-size:12px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .block{padding:12px 16px;border-top:1px solid var(--line)}
  .block h2{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:600}
  button,.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;
    padding:7px 10px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  button:hover,.btn:hover{border-color:#3d434a}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.danger{background:var(--danger);border-color:var(--danger);color:#200}
  button:disabled{opacity:.45;cursor:not-allowed}
  .presets button{font-size:12px;padding:5px 9px}
  .presets button.on{border-color:var(--accent);color:var(--accent)}
  .ctl{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;margin:6px 0}
  .ctl label{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl output{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;text-align:right}
  .ctl.sel{grid-template-columns:92px 1fr}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select,input[type=color],input[type=number]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit}
  input[type=color]{padding:0 2px;height:26px}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
  .export{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap}
  .export button{flex:1;justify-content:center}
  .note{color:var(--dim);font-size:11px;margin-top:6px}
  .src-name{color:var(--dim);font-size:11px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a{color:var(--accent)}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
    .stage{height:55vh;padding:12px}
    aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <span class="pill" id="status">Demo source — drop a video or image</span>
      <div class="progress" id="progress"><i></i></div>
    </div>
  </main>

  <aside>
    <header>
      <h1>Glass Block Video</h1>
      <p>Refractive glass tiles that bend whatever is underneath. Load a clip, tune, export.</p>
    </header>

    <div class="block">
      <h2>Source</h2>
      <div class="row">
        <label class="btn primary" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600">
          Open file<input id="file" type="file" accept="video/*,image/*" hidden>
        </label>
        <button id="cam">Webcam</button>
        <button id="demo">Demo</button>
        <button id="playpause">Pause</button>
      </div>
      <div class="src-name" id="srcName">Animated demo</div>
    </div>

    <div class="block">
      <h2>Presets</h2>
      <div class="row presets" id="presets"></div>
    </div>

    <div class="block" id="grp-glass"><h2>Glass</h2></div>
    <div class="block" id="grp-light"><h2>Light &amp; surface</h2></div>
    <div class="block" id="grp-cover"><h2>Coverage</h2></div>
    <div class="block" id="grp-motion"><h2>Motion</h2></div>
    <div class="block" id="grp-out"><h2>Output</h2>
      <div class="note" id="fmtNote"></div>
    </div>

    <div class="export">
      <button id="snap">Save PNG</button>
      <button id="rec" class="primary">Export video</button>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';

/* ---------------- parameters ---------------- */
const SHAPES = ['Pillow blocks','Pyramid prisms','Dome lens','Reeded vertical','Reeded horizontal','Bevelled tiles','Diamond facets','Bubbles'];
const MASKS  = ['Full frame','Left side','Right side','Top','Bottom','Vertical band','Circle'];
const SIZES  = {source:'Match source','1080x1920':'9:16 — 1080×1920','1080x1350':'4:5 — 1080×1350','1080x1080':'1:1 — 1080×1080','1920x1080':'16:9 — 1920×1080','720x1280':'9:16 — 720×1280'};

const SCHEMA = [
  // group, key, label, type, min, max, step, default
  ['glass','shape','Pattern','select',SHAPES,1],
  ['glass','cell','Block size',  'range',4,200,1,30],
  ['glass','angle','Rotation',   'range',-90,90,1,0],
  ['glass','zoom','Lens scale',  'range',-1.5,2,0.01,0.3],
  ['glass','refract','Refraction','range',-2,2,0.01,0.55],
  ['glass','frost','Frost blur', 'range',0,24,0.1,0],
  ['glass','chroma','Dispersion','range',0,0.6,0.005,0.08],

  ['light','bump','Bump depth',  'range',0,4,0.01,1.0],
  ['light','light','Light angle','range',0,360,1,225],
  ['light','shade','Shading',    'range',0,1.5,0.01,0.12],
  ['light','highlight','Highlights','range',0,3,0.01,0.35],
  ['light','shine','Gloss',      'range',2,200,1,30],
  ['light','react','Reactivity', 'range',0,1,0.01,0.75],
  ['light','edgeW','Seam width', 'range',0,0.6,0.005,0.06],
  ['light','edgeDark','Seam shadow','range',-1,1,0.01,0.15],
  ['light','milk','Milkiness',   'range',0,1,0.01,0.06],
  ['light','tint','Tint',        'color','#eef4f2'],
  ['light','grain','Grain',      'range',0,0.25,0.005,0.02],

  ['cover','mask','Area','select',MASKS,1],
  ['cover','split','Position',   'range',0,1,0.005,0.58],
  ['cover','bandW','Band width', 'range',0,1,0.005,0.35],
  ['cover','feather','Feather',  'range',0,0.4,0.005,0.05],
  ['cover','ragged','Ragged edge','range',0,0.4,0.005,0.08],
  ['cover','snap','Snap to blocks','check',true],

  ['motion','driftX','Drift X',  'range',-300,300,1,0],
  ['motion','driftY','Drift Y',  'range',-300,300,1,0],
  ['motion','spin','Spin',       'range',-30,30,0.1,0],
  ['motion','sweep','Sweep amount','range',0,0.5,0.005,0],
  ['motion','sweepSpeed','Sweep speed','range',0,2,0.01,0.25],

  ['out','size','Size','select',SIZES,'source'],
  ['out','aa','Anti-alias','check',true],
  ['out','fps','Frame rate','select',{30:'30 fps',60:'60 fps',24:'24 fps'},'30'],
  ['out','bitrate','Quality','select',{6:'Standard (6 Mbps)',12:'High (12 Mbps)',24:'Max (24 Mbps)'},'12'],
  ['out','format','Format','select',{auto:'Auto (MP4 if possible)',mp4:'MP4',webm:'WebM'},'auto'],
  ['out','duration','Length (s)','number',1,120,1,8],
];

const DEFAULTS = {};
SCHEMA.forEach(s => { DEFAULTS[s[1]] = s[s.length-1]; });
const P = Object.assign({}, DEFAULTS);

const PRESETS = {
  'Glass blocks': {},
  'Pillow': {shape:0, zoom:0.2, refract:0.9, bump:0.8, edgeW:0.08, edgeDark:0.2},
  'Full pane': {mask:0, cell:32, zoom:0.3, refract:0.5, frost:1.2},
  'Reeded': {shape:3, cell:22, zoom:-0.4, refract:0.3, frost:0.4, chroma:0.12, highlight:0.9, edgeW:0.05, edgeDark:0.2, mask:0},
  'Prism': {shape:1, cell:40, zoom:0.6, refract:1.1, chroma:0.18, bump:1.4, shade:0.4, highlight:1.2, shine:60, edgeW:0.03, mask:0},
  'Diamond': {shape:6, cell:46, angle:0, zoom:0.5, refract:0.9, chroma:0.12, highlight:1, mask:2, split:0.4},
  'Frosted tile': {shape:5, cell:60, zoom:0.85, refract:0.6, frost:7, shade:0.3, highlight:0.6, milk:0.18, edgeW:0.12, edgeDark:0.45, mask:0},
  'Bubbles': {shape:7, cell:36, zoom:-0.6, refract:0.4, chroma:0.15, bump:1.4, shade:0.45, highlight:1.4, shine:80, edgeW:0.06, edgeDark:0.5, mask:6, split:0.6, feather:0.03},
  'Tiny mosaic': {shape:0, cell:9, zoom:0.2, refract:0.6, frost:0, highlight:0.5, edgeW:0.15, mask:0},
  'Sweep': {mask:1, sweep:0.35, sweepSpeed:0.3, split:0.5, ragged:0.12},
};

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const inputs = {};
function buildControls(){
  SCHEMA.forEach(s => {
    const [g,key,label,type] = s;
    const wrap = document.createElement('div');
    wrap.className = 'ctl' + (type==='range' ? '' : ' sel');
    const lab = document.createElement('label'); lab.textContent = label; lab.htmlFor = 'c_'+key;
    wrap.appendChild(lab);
    let el, out;
    if (type === 'range'){
      el = document.createElement('input'); el.type='range';
      el.min=s[4]; el.max=s[5]; el.step=s[6];
      out = document.createElement('output');
      el.addEventListener('input', () => { P[key] = +el.value; out.textContent = fmt(+el.value, s[6]); clearPresetHighlight(); });
      el.addEventListener('dblclick', () => setParam(key, DEFAULTS[key]));
    } else if (type === 'select'){
      el = document.createElement('select');
      const opts = s[4];
      if (Array.isArray(opts)) opts.forEach((o,i)=>el.add(new Option(o,i)));
      else Object.entries(opts).forEach(([v,t])=>el.add(new Option(t,v)));
      el.addEventListener('change', () => { P[key] = Array.isArray(opts) ? +el.value : el.value; onParamChange(key); clearPresetHighlight(); });
    } else if (type === 'check'){
      el = document.createElement('input'); el.type='checkbox';
      el.addEventListener('change', () => { P[key] = el.checked; onParamChange(key); });
      wrap.style.gridTemplateColumns = '92px auto';
    } else if (type === 'color'){
      el = document.createElement('input'); el.type='color';
      el.addEventListener('input', () => { P[key] = el.value; });
    } else if (type === 'number'){
      el = document.createElement('input'); el.type='number'; el.min=s[4]; el.max=s[5]; el.step=s[6];
      el.addEventListener('change', () => { P[key] = Math.max(s[4], Math.min(s[5], +el.value||DEFAULTS[key])); el.value=P[key]; });
    }
    el.id = 'c_'+key;
    wrap.appendChild(el); if (out) wrap.appendChild(out);
    inputs[key] = {el,out,s};
    const grp = $('grp-'+g);
    grp.insertBefore(wrap, g==='out' ? $('fmtNote') : null);
  });
  Object.keys(P).forEach(k => setParam(k, P[k], true));

  const pc = $('presets');
  Object.keys(PRESETS).forEach((name,i) => {
    const b = document.createElement('button'); b.textContent = name;
    if (i===0) b.classList.add('on');
    b.onclick = () => applyPreset(name, b);
    pc.appendChild(b);
  });
}
function fmt(v, step){ const d = step>=1?0:step>=0.1?1:step>=0.01?2:3; return v.toFixed(d); }
function setParam(key, v, silent){
  const c = inputs[key]; if (!c) return;
  P[key] = v;
  if (c.s[3]==='check') c.el.checked = !!v; else c.el.value = v;
  if (c.out) c.out.textContent = fmt(+v, c.s[6]);
  if (!silent) onParamChange(key);
}
function clearPresetHighlight(){ document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on')); }
function applyPreset(name, btn){
  const keep = ['size','aa','fps','bitrate','format','duration'];
  Object.keys(DEFAULTS).forEach(k => { if (!keep.includes(k)) setParam(k, DEFAULTS[k], true); });
  Object.entries(PRESETS[name]).forEach(([k,v]) => setParam(k, v, true));
  clearPresetHighlight(); btn.classList.add('on');
  spinAngle = 0; drift = [0,0]; sweepPhase = 0;
}
function onParamChange(key){
  if (key==='size') resize();
  if (key==='format') updateFormatNote();
}

/* ---------------- WebGL ---------------- */
const canvas = $('gl');
const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false, premultipliedAlpha:false});
if (!gl){ $('status').textContent = 'WebGL is not available in this browser.'; return; }

const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uCover, uOffset;
uniform float uCell, uAngle, uZoom, uRefract, uBump, uFrost, uChroma, uHighlight, uShine, uShade, uReact,
              uLight, uEdgeW, uEdgeDark, uMilk, uGrain, uTime, uSplit, uFeather, uRagged, uBandW, uSnap;
uniform vec3 uTint;
uniform int uShape, uMask, uAA;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }

vec3 src(vec2 px){
  vec2 uv = (px/uRes - 0.5)*uCover + 0.5;
  return texture2D(uTex, clamp(uv, vec2(0.0005), vec2(0.9995))).rgb;
}

float height(vec2 c){
  if(uShape==0){ vec2 a = 1.0 - c*c; return a.x*a.y; }
  if(uShape==1){ return 1.0 - max(abs(c.x),abs(c.y)); }
  if(uShape==2){ return sqrt(max(0.0, 1.0 - dot(c,c)*0.5)); }
  if(uShape==3){ return 1.0 - c.x*c.x; }
  if(uShape==4){ return 1.0 - c.y*c.y; }
  if(uShape==5){ return 1.0 - smoothstep(0.45, 1.0, max(abs(c.x),abs(c.y))); }
  if(uShape==6){ return 1.0 - (abs(c.x)+abs(c.y))*0.5; }
  float r = length(c); return r<1.0 ? sqrt(1.0-r*r) : 0.0;
}

float maskAt(vec2 uv, float h){
  float rag = (h-0.5)*uRagged;
  float f = max(uFeather, 0.0005);
  if(uMask==0) return 1.0;
  if(uMask==1) return 1.0 - smoothstep(uSplit-f, uSplit+f, uv.x + rag);
  if(uMask==2) return smoothstep(uSplit-f, uSplit+f, uv.x + rag);
  if(uMask==3) return 1.0 - smoothstep(uSplit-f, uSplit+f, uv.y + rag);
  if(uMask==4) return smoothstep(uSplit-f, uSplit+f, uv.y + rag);
  if(uMask==5) return 1.0 - smoothstep(uBandW*0.5-f, uBandW*0.5+f, abs(uv.x-uSplit) + rag);
  vec2 d = (uv-0.5)*vec2(uRes.x/uRes.y, 1.0);
  return 1.0 - smoothstep(uSplit*0.6-f, uSplit*0.6+f, length(d) + rag);
}

vec4 shadeAt(vec2 p){
  mat2 R = rot(uAngle);
  vec2 q = rot(-uAngle)*(p - 0.5*uRes) + uOffset;
  vec2 g = q/uCell;
  vec2 cell = floor(g), f = fract(g), c = f*2.0 - 1.0;
  vec2 axis = uShape==3 ? vec2(1.0,0.0) : (uShape==4 ? vec2(0.0,1.0) : vec2(1.0));

  float e = 0.015;
  vec2 grad = vec2(height(c+vec2(e,0.))-height(c-vec2(e,0.)),
                   height(c+vec2(0.,e))-height(c-vec2(0.,e))) / (2.0*e);

  // where this pixel looks through the glass: per-block lens + surface-normal refraction
  vec2 off = R*((f-0.5)*uCell*(uZoom-1.0)*axis - grad*uRefract*uCell*0.5);

  vec3 col = vec3(0.0);
  float rnd = hash(p + fract(uTime)*17.0)*6.2831;
  int n = uFrost > 0.01 ? 12 : 1;
  for(int i=0;i<12;i++){
    if(i>=n) break;
    float fi = float(i);
    float r = sqrt((fi+0.5)/12.0)*uFrost;
    float a = fi*2.39996 + rnd;
    vec2 b = p + vec2(cos(a),sin(a))*r;
    col.r += src(b + off*(1.0+uChroma)).r;
    col.g += src(b + off).g;
    col.b += src(b + off*(1.0-uChroma)).b;
  }
  col /= float(n);

  // lighting reacts to what's behind the glass
  float lum = dot(col, vec3(0.299,0.587,0.114));
  float react = mix(1.0, 0.12 + lum*1.8, uReact);
  vec3 N = normalize(vec3(-(R*grad)*uBump, 1.0));
  vec3 L = normalize(vec3(cos(uLight), sin(uLight), 1.1));
  float diff = dot(N,L) - L.z;
  col *= 1.0 + diff*uShade*mix(1.0, 0.5+lum, uReact);
  float spec = pow(max(dot(reflect(-L,N), vec3(0.,0.,1.)), 0.0), uShine);
  vec3 sCol = mix(vec3(1.0), clamp(col/(lum+0.05)*0.7, 0.0, 1.5), 0.35);
  col += spec*uHighlight*react*sCol;

  // seams between blocks
  float ed = uShape==3 ? abs(c.x) : (uShape==4 ? abs(c.y) : (uShape==7 ? min(length(c),1.0) : max(abs(c.x),abs(c.y))));
  float em = uEdgeW > 0.0 ? smoothstep(1.0-uEdgeW, 1.0, ed) : 0.0;
  col *= 1.0 - em*uEdgeDark*mix(1.0, 0.4+lum, uReact*0.5);

  col = mix(col, uTint*(0.55+0.6*lum), uMilk);
  col += (hash(p*1.37 + fract(uTime)*31.0) - 0.5)*uGrain;

  vec2 centre = p + R*((0.5-f)*uCell*axis);
  vec2 cid = cell*axis;
  float m = maskAt((uSnap>0.5 ? centre : p)/uRes, hash(cid + 3.1));
  return vec4(col, m);
}

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec4 acc = vec4(0.0);
  if(uAA==1){
    acc += shadeAt(p + vec2(-0.25,-0.25));
    acc += shadeAt(p + vec2( 0.25,-0.25));
    acc += shadeAt(p + vec2(-0.25, 0.25));
    acc += shadeAt(p + vec2( 0.25, 0.25));
    acc *= 0.25;
  } else acc = shadeAt(p);
  vec3 clear = src(p);
  gl_FragColor = vec4(mix(clear, clamp(acc.rgb,0.0,1.0), acc.a), 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uTex','uRes','uCover','uOffset','uCell','uAngle','uZoom','uRefract','uBump','uFrost','uChroma','uHighlight','uShine','uShade','uReact',
 'uLight','uEdgeW','uEdgeDark','uMilk','uGrain','uTime','uSplit','uFeather','uRagged','uBandW','uSnap','uTint','uShape','uMask','uAA']
 .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

/* ---------------- sources ---------------- */
const video = document.createElement('video');
video.playsInline = true; video.loop = true; video.crossOrigin = 'anonymous';
const camVideo = document.createElement('video');
camVideo.playsInline = true; camVideo.muted = true;
let img = null, camStream = null;
let source = {kind:'demo', el:null, w:1080, h:1350};

// procedural demo so the effect is visible immediately
const demo = document.createElement('canvas'); demo.width = 1080; demo.height = 1350;
const dctx = demo.getContext('2d');
function drawDemo(t){
  const W = demo.width, H = demo.height;
  const g = dctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#e9e4dc'); g.addColorStop(1,'#c9c2b8');
  dctx.fillStyle = g; dctx.fillRect(0,0,W,H);
  const blobs = [['#1b1512',.55,.45,.36,0.0],['#e8643c',.3,.25,.16,1.7],['#2e5fd8',.72,.72,.2,3.1],['#f2c94c',.25,.78,.13,4.4],['#0d0d0d',.6,.2,.09,5.2]];
  blobs.forEach(([c,x,y,r,ph]) => {
    dctx.beginPath();
    dctx.arc(W*(x+0.08*Math.sin(t*0.6+ph)), H*(y+0.06*Math.cos(t*0.5+ph*1.3)), W*r*(1+0.06*Math.sin(t*1.1+ph)), 0, Math.PI*2);
    dctx.fillStyle = c; dctx.fill();
  });
  dctx.save();
  dctx.translate(W*0.5, H*0.5); dctx.rotate(Math.sin(t*0.3)*0.08);
  dctx.fillStyle = '#ffffff'; dctx.font = '800 220px system-ui, sans-serif'; dctx.textAlign = 'center'; dctx.textBaseline='middle';
  dctx.fillText('GLASS', Math.sin(t*0.4)*80, -40);
  dctx.font = '600 70px system-ui, sans-serif'; dctx.fillStyle='#111';
  dctx.fillText('drop a video', -Math.sin(t*0.4)*60, 130);
  dctx.restore();
  for (let i=0;i<12;i++){ // thin lines to show refraction clearly
    dctx.fillStyle = i%2 ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.7)';
    dctx.fillRect(0, ((i*113 + t*60) % (H+40)) - 20, W, 6);
  }
}

function setSource(kind, el, w, h, name){
  source = {kind, el, w, h};
  $('srcName').textContent = name;
  $('playpause').textContent = 'Pause';
  if (kind !== 'camera' && camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
  if (kind !== 'video') video.pause();
  if (kind === 'image') uploadFrame();
  resize();
  setStatus(kind==='video' ? `${w}×${h} video · ${video.duration.toFixed(1)}s` : kind==='image' ? `${w}×${h} image` : kind==='camera' ? 'Webcam' : 'Demo source — drop a video or image');
}

function loadFile(file){
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')){
    const im = new Image();
    im.onload = () => { img = im; setSource('image', im, im.naturalWidth, im.naturalHeight, file.name); };
    im.onerror = () => setStatus('Could not read that image.');
    im.src = url;
  } else {
    video.onloadeddata = () => {
      setSource('video', video, video.videoWidth, video.videoHeight, file.name);
      video.play().catch(()=>{});
    };
    video.onerror = () => setStatus('This browser cannot decode that video. Try MP4 (H.264) or WebM.');
    video.src = url; video.load();
  }
}

$('file').addEventListener('change', e => loadFile(e.target.files[0]));
$('demo').onclick = () => setSource('demo', demo, demo.width, demo.height, 'Animated demo');
$('cam').onclick = async () => {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}}, audio:false});
    camVideo.srcObject = camStream; await camVideo.play();
    setSource('camera', camVideo, camVideo.videoWidth, camVideo.videoHeight, 'Webcam');
  } catch(err){ setStatus('Webcam unavailable: ' + err.message); }
};
let paused = false;
$('playpause').onclick = () => {
  paused = !paused;
  if (source.kind==='video'){ paused ? video.pause() : video.play(); }
  $('playpause').textContent = paused ? 'Play' : 'Pause';
};

const stage = $('stage');
['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('drag'); }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
window.addEventListener('paste', e => { const f = [...(e.clipboardData?.files||[])][0]; if (f) loadFile(f); });

/* ---------------- sizing ---------------- */
const MAX_SIDE = 2160;
let cover = [1,1];
function resize(){
  let W, H;
  if (P.size === 'source'){
    W = source.w; H = source.h;
    const s = Math.min(1, MAX_SIDE / Math.max(W,H));
    W = Math.round(W*s/2)*2; H = Math.round(H*s/2)*2;
  } else [W,H] = P.size.split('x').map(Number);
  canvas.width = W; canvas.height = H;
  gl.viewport(0,0,W,H);
  // cover-fit source into output
  const sa = source.w/source.h, oa = W/H;
  cover = sa > oa ? [oa/sa, 1] : [1, sa/oa];
}

function uploadFrame(){
  const el = source.kind==='demo' ? demo : source.el;
  if (!el) return;
  if (el instanceof HTMLVideoElement && el.readyState < 2) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, el); } catch(e){}
}

/* ---------------- render loop ---------------- */
let last = performance.now(), clock = 0, spinAngle = 0, drift = [0,0], sweepPhase = 0;
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }

function frame(now){
  const dt = Math.min(0.1, (now-last)/1000); last = now;
  if (!paused){
    clock += dt;
    spinAngle += P.spin*dt;
    drift[0] += P.driftX*dt; drift[1] += P.driftY*dt;
    sweepPhase += P.sweepSpeed*dt*Math.PI*2;
  }
  if (source.kind==='demo' && !paused) drawDemo(clock);
  if (source.kind!=='image') uploadFrame();

  const split = Math.min(1.2, Math.max(-0.2, P.split + Math.sin(sweepPhase)*P.sweep));
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uCover, cover[0], cover[1]);
  gl.uniform2f(U.uOffset, drift[0], drift[1]);
  gl.uniform1f(U.uCell, P.cell);
  gl.uniform1f(U.uAngle, (P.angle + spinAngle)*Math.PI/180);
  gl.uniform1f(U.uZoom, P.zoom);
  gl.uniform1f(U.uRefract, P.refract);
  gl.uniform1f(U.uBump, P.bump);
  gl.uniform1f(U.uFrost, P.frost);
  gl.uniform1f(U.uChroma, P.chroma);
  gl.uniform1f(U.uHighlight, P.highlight);
  gl.uniform1f(U.uShine, P.shine);
  gl.uniform1f(U.uShade, P.shade);
  gl.uniform1f(U.uReact, P.react);
  gl.uniform1f(U.uLight, P.light*Math.PI/180);
  gl.uniform1f(U.uEdgeW, P.edgeW);
  gl.uniform1f(U.uEdgeDark, P.edgeDark);
  gl.uniform1f(U.uMilk, P.milk);
  gl.uniform1f(U.uGrain, P.grain);
  gl.uniform1f(U.uTime, clock);
  gl.uniform1f(U.uSplit, split);
  gl.uniform1f(U.uFeather, P.feather);
  gl.uniform1f(U.uRagged, P.ragged);
  gl.uniform1f(U.uBandW, P.bandW);
  gl.uniform1f(U.uSnap, P.snap ? 1 : 0);
  gl.uniform3fv(U.uTint, hexToRgb(P.tint));
  gl.uniform1i(U.uShape, P.shape);
  gl.uniform1i(U.uMask, P.mask);
  gl.uniform1i(U.uAA, P.aa ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (rec) updateRecProgress();
  requestAnimationFrame(frame);
}

/* ---------------- export ---------------- */
function setStatus(t){ $('status').textContent = t; }

function pickMime(){
  if (typeof MediaRecorder === 'undefined') return null;
  const mp4 = ['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4'];
  const webm = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const order = P.format==='mp4' ? mp4.concat(webm) : P.format==='webm' ? webm.concat(mp4) : mp4.concat(webm);
  return order.find(m => MediaRecorder.isTypeSupported(m)) || null;
}
function updateFormatNote(){
  const m = pickMime();
  $('fmtNote').textContent = m ? `Exports as ${m.split(';')[0].replace('video/','').toUpperCase()} (${m.split(';')[1]||'default codec'}). Video files are rendered start to end in real time; other sources record for the length above.` : 'Video recording is not supported in this browser — PNG export still works.';
}

let audioCtx = null, audioDest = null;
function videoAudioTrack(){
  try {
    if (!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const node = audioCtx.createMediaElementSource(video);
      audioDest = audioCtx.createMediaStreamDestination();
      node.connect(audioDest); node.connect(audioCtx.destination);
    }
    audioCtx.resume();
    return audioDest.stream.getAudioTracks()[0] || null;
  } catch(e){ return null; }
}

let rec = null;
async function startRecording(){
  const mime = pickMime();
  if (!mime){ setStatus('Recording not supported here.'); return; }
  const fps = +P.fps;
  const stream = canvas.captureStream(fps);
  const isVideo = source.kind === 'video';
  if (isVideo){
    const at = videoAudioTrack(); if (at) stream.addTrack(at);
  }
  const chunks = [];
  const mr = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:+P.bitrate*1e6, audioBitsPerSecond:192000});
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const type = mime.split(';')[0];
    const blob = new Blob(chunks, {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `glass-${Date.now()}.${type.includes('mp4')?'mp4':'webm'}`;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(`Saved ${(blob.size/1048576).toFixed(1)} MB ${a.download}`);
    endRecordingUI();
  };
  rec = {mr, isVideo, start: performance.now(), dur: isVideo ? video.duration : P.duration};

  if (isVideo){
    paused = false; $('playpause').textContent = 'Pause';
    video.loop = false; video.pause();
    await new Promise(r => { video.onseeked = () => { video.onseeked = null; r(); }; video.currentTime = 0; });
    video.onended = () => stopRecording();
    mr.start(250);
    await video.play();
  } else {
    mr.start(250);
    rec.timer = setTimeout(stopRecording, P.duration*1000);
  }
  $('rec').textContent = 'Stop'; $('rec').classList.remove('primary'); $('rec').classList.add('danger');
  $('progress').style.display = 'block';
  document.querySelectorAll('#c_size,#c_fps,#c_format,#c_bitrate').forEach(e=>e.disabled=true);
}
function stopRecording(){
  if (!rec) return;
  clearTimeout(rec.timer);
  video.onended = null;
  if (rec.mr.state !== 'inactive') rec.mr.stop();
  if (rec.isVideo){ video.loop = true; video.play().catch(()=>{}); }
}
function endRecordingUI(){
  rec = null;
  $('rec').textContent = 'Export video'; $('rec').classList.add('primary'); $('rec').classList.remove('danger');
  $('progress').style.display = 'none'; $('progress').firstElementChild.style.width = '0';
  document.querySelectorAll('#c_size,#c_fps,#c_format,#c_bitrate').forEach(e=>e.disabled=false);
}
function updateRecProgress(){
  const t = rec.isVideo ? video.currentTime : (performance.now()-rec.start)/1000;
  const pct = Math.min(100, t/rec.dur*100);
  $('progress').firstElementChild.style.width = pct + '%';
  $('status').innerHTML = `<span class="rec-dot"></span>Recording ${t.toFixed(1)} / ${rec.dur.toFixed(1)}s`;
}
$('rec').onclick = () => rec ? stopRecording() : startRecording();
$('snap').onclick = () => canvas.toBlob(b => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `glass-${Date.now()}.png`; a.click();
}, 'image/png');

/* ---------------- go ---------------- */
buildControls();
updateFormatNote();
source.el = demo;
drawDemo(0);
resize();
requestAnimationFrame(frame);
window.__glass = {P, setParam, loadFile};
})();
</script>
</body>
</html>
