<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Block Video</title>
<meta name="description" content="Generate looping videos of light on black, refracted through wave glass blocks.">
<style>
  :root{
    --bg:#0e0f11; --panel:#16181b; --panel2:#1d2024; --line:#2a2e33; --text:#e9eaec; --dim:#9aa0a7;
    --accent:#e8ecf2; --accent-ink:#0e0f11; --danger:#ff6b5e;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{display:grid;grid-template-columns:1fr 340px;height:100%}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;min-height:0;background:#08090a}
  .stage canvas{max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px;background:#000}
  .stage.drag::after{content:"Drop a video or image";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,.6);color:var(--accent)}
  .hud{position:absolute;left:20px;bottom:16px;right:20px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .pill{background:rgba(20,22,25,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--dim)}
  .rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--danger)}

  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  header{padding:16px 16px 10px}
  header h1{margin:0;font-size:16px;letter-spacing:.2px}
  header p{margin:4px 0 0;color:var(--dim);font-size:12px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .block{padding:12px 16px;border-top:1px solid var(--line)}
  .block h2{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:600}
  button,.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;
    padding:7px 10px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  button:hover,.btn:hover{border-color:#3d434a}
  button:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.danger{background:var(--danger);border-color:var(--danger);color:#200}
  button.on{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ctl{display:grid;grid-template-columns:100px 1fr 44px;align-items:center;gap:8px;margin:6px 0}
  .ctl label{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl output{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;text-align:right}
  .ctl.sel{grid-template-columns:100px 1fr}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select,input[type=color],input[type=number]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit}
  input[type=color]{padding:0 2px;height:26px}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
  .export{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap}
  .export button{flex:1;justify-content:center}
  .note{color:var(--dim);font-size:11px;margin-top:6px}
  .src-name{color:var(--dim);font-size:11px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
    .stage{height:60vh;padding:12px}
    aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <span class="pill" id="status">Generated light · seamless loop</span>
      <div class="progress" id="progress" hidden><i></i></div>
    </div>
  </main>

  <aside>
    <header>
      <h1>Glass Block Video</h1>
      <p>Light on black, bent through cast wave glass blocks. Tune it, then export a looping video.</p>
    </header>

    <div class="block">
      <h2>Preset</h2>
      <div class="row">
        <button id="preset" class="on">Wave blocks</button>
        <button id="playpause">Pause</button>
      </div>
    </div>

    <div class="block" id="grp-light"><h2>Light</h2></div>
    <div class="block" id="grp-glass"><h2>Wave blocks</h2></div>
    <div class="block" id="grp-mortar"><h2>Mortar</h2></div>
    <div class="block" id="grp-shine"><h2>Reflections</h2></div>
    <div class="block" id="grp-out"><h2>Output</h2><div class="note" id="fmtNote"></div></div>

    <div class="block">
      <h2>Own footage</h2>
      <div class="row">
        <label class="btn">Use a video or image<input id="file" type="file" accept="video/*,image/*" hidden></label>
        <button id="backToLight" hidden>Back to generated light</button>
      </div>
      <div class="src-name" id="srcName">Optional. The glass works on any footage too.</div>
    </div>

    <div class="export">
      <button id="snap">Save PNG</button>
      <button id="rec" class="primary">Export video</button>
      <button id="resave" hidden>Save last export again</button>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
(() => {
'use strict';

/* ---------------- parameters ---------------- */
const STYLES = ['Glowing orbs','Light bars','Sweeping beams','Halo rings','Ribbons'];
const MORTAR = ['None (blocks flush)','Dark','Pale'];
const SIZES  = {'1080x1920':'9:16 — 1080×1920','1080x1350':'4:5 — 1080×1350','1080x1080':'1:1 — 1080×1080','1920x1080':'16:9 — 1920×1080','3840x2160':'16:9 — 3840×2160 (4K)','720x1280':'9:16 — 720×1280'};

const SCHEMA = [
  // group, key, label, type, ...
  ['light','style','Light','select',STYLES,3],
  ['light','colA','Colour 1','color','#ffffff'],
  ['light','colB','Colour 2','color','#6f8dff'],
  ['light','count','Number',      'range',1,8,1,3],
  ['light','lsize','Light size',  'range',0.2,3,0.01,1],
  ['light','bright','Brightness', 'range',0.1,4,0.01,1.4],
  ['light','speed','Speed',       'range',1,6,1,1],
  ['light','bg','Background','color','#000000'],

  ['glass','cell','Block size',   'range',40,600,1,220],
  ['glass','wave','Wave depth',   'range',0,4,0.01,2.4],
  ['glass','waveScale','Wave size','range',0.5,6,0.05,1.2],
  ['glass','waveTwist','Swirl',   'range',0,3,0.01,1.2],
  ['glass','crease','Sharp folds','range',0,1,0.01,0.25],
  ['glass','rim','Rim width',     'range',0.01,0.4,0.005,0.12],
  ['glass','refract','Refraction','range',0,2.5,0.01,0.9],
  ['glass','zoom','Lens scale',   'range',-1,1.5,0.01,0.95],
  ['glass','moldVar','Block variation','range',0,1,0.01,0.12],
  ['glass','chroma','Dispersion', 'range',0,0.4,0.005,0.05],
  ['glass','frost','Frost blur',  'range',0,16,0.1,0],

  ['mortar','mortar','Mortar','select',MORTAR,0],
  ['mortar','gap','Mortar width', 'range',0.005,0.3,0.002,0.06],

  ['shine','highlight','Glints',  'range',0,3,0.01,1.0],
  ['shine','shine','Gloss',       'range',2,200,1,45],
  ['shine','sheen','Sheen in dark','range',0,0.6,0.005,0.06],
  ['shine','react','Light pickup','range',0,2,0.01,1],
  ['shine','lightAng','Light angle','range',0,360,1,225],
  ['shine','edgeDark','Edge shadow','range',0,1,0.01,0.55],
  ['shine','grain','Grain',       'range',0,0.15,0.005,0.015],

  ['out','size','Size','select',SIZES,'1080x1920'],
  ['out','duration','Length (s)','number',1,120,1,8],
  ['out','aa','Anti-alias','check',true],
  ['out','fps','Frame rate','select',{30:'30 fps',60:'60 fps',24:'24 fps'},'30'],
  ['out','bitrate','Quality','select',{8:'Standard (8 Mbps)',16:'High (16 Mbps)',32:'Max (32 Mbps)'},'16'],
  ['out','format','Format','select',{auto:'Auto (MP4 if possible)',mp4:'MP4',webm:'WebM'},'auto'],
];
const DEFAULTS = {};
SCHEMA.forEach(s => { DEFAULTS[s[1]] = s[s.length-1]; });
const P = Object.assign({}, DEFAULTS);
const OUTPUT_KEYS = ['size','duration','aa','fps','bitrate','format'];

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const inputs = {};
function fmt(v, step){ const d = step>=1?0:step>=0.1?1:step>=0.01?2:3; return v.toFixed(d); }
function buildControls(){
  SCHEMA.forEach(s => {
    const [g,key,label,type] = s;
    const wrap = document.createElement('div');
    wrap.className = 'ctl' + (type==='range' ? '' : ' sel');
    const lab = document.createElement('label'); lab.textContent = label; lab.htmlFor = 'c_'+key;
    wrap.appendChild(lab);
    let el, out;
    if (type === 'range'){
      el = document.createElement('input'); el.type='range'; el.min=s[4]; el.max=s[5]; el.step=s[6];
      out = document.createElement('output');
      el.addEventListener('input', () => { P[key] = +el.value; out.textContent = fmt(+el.value, s[6]); presetOff(); });
      el.addEventListener('dblclick', () => setParam(key, DEFAULTS[key]));
    } else if (type === 'select'){
      el = document.createElement('select');
      const opts = s[4];
      if (Array.isArray(opts)) opts.forEach((o,i)=>el.add(new Option(o,i)));
      else Object.entries(opts).forEach(([v,t])=>el.add(new Option(t,v)));
      el.addEventListener('change', () => { P[key] = Array.isArray(opts) ? +el.value : el.value; onParamChange(key); presetOff(); });
    } else if (type === 'check'){
      el = document.createElement('input'); el.type='checkbox';
      el.addEventListener('change', () => { P[key] = el.checked; });
      wrap.style.gridTemplateColumns = '100px auto';
    } else if (type === 'color'){
      el = document.createElement('input'); el.type='color';
      el.addEventListener('input', () => { P[key] = el.value; presetOff(); });
    } else if (type === 'number'){
      el = document.createElement('input'); el.type='number'; el.min=s[4]; el.max=s[5]; el.step=s[6];
      el.addEventListener('change', () => { P[key] = Math.max(s[4], Math.min(s[5], +el.value||DEFAULTS[key])); el.value=P[key]; });
    }
    el.id = 'c_'+key;
    wrap.appendChild(el); if (out) wrap.appendChild(out);
    if (key==='gap') wrap.id = 'row_gap';
    inputs[key] = {el,out,s};
    $('grp-'+g).insertBefore(wrap, g==='out' ? $('fmtNote') : null);
  });
  Object.keys(P).forEach(k => setParam(k, P[k], true));
  onParamChange('mortar');
}
function setParam(key, v, silent){
  const c = inputs[key]; if (!c) return;
  P[key] = v;
  if (c.s[3]==='check') c.el.checked = !!v; else c.el.value = v;
  if (c.out) c.out.textContent = fmt(+v, c.s[6]);
  if (!silent) onParamChange(key);
}
function presetOff(){ $('preset').classList.remove('on'); }
$('preset').onclick = () => {
  Object.keys(DEFAULTS).forEach(k => { if (!OUTPUT_KEYS.includes(k)) setParam(k, DEFAULTS[k], true); });
  onParamChange('mortar');
  $('preset').classList.add('on');
};
function onParamChange(key){
  if (key==='size') resize();
  if (key==='format') updateFormatNote();
  if (key==='mortar') $('row_gap').hidden = P.mortar === 0;
}

/* ---------------- WebGL ---------------- */
const canvas = $('gl');
const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false, premultipliedAlpha:false});
if (!gl){ $('status').textContent = 'WebGL is not available in this browser.'; return; }

const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;

// Pass 1: procedural light on a dark background. Motion is periodic in uPhase so clips loop seamlessly.
const FS_LIGHT = `
precision highp float;
uniform vec2 uRes;
uniform float uPhase, uSize, uBright, uCount;
uniform int uStyle;
uniform vec3 uColA, uColB, uBg;
float h(float n){ return fract(sin(n*127.1 + 3.7)*43758.5453); }
vec3 pal(float k){ return mix(uColA, uColB, k); }
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  float asp = uRes.x/uRes.y, a = uPhase;
  vec3 c = vec3(0.0);
  for(int i=0;i<8;i++){
    float fi = float(i);
    if(fi >= uCount) break;
    float k1 = 1.0 + floor(h(fi+1.0)*2.0), k2 = 1.0 + floor(h(fi+2.0)*2.0);
    float ph1 = h(fi+3.0)*6.2831, ph2 = h(fi+4.0)*6.2831;
    vec3 col = pal(uCount > 1.0 ? fi/(uCount-1.0) : 0.0);
    if(uStyle==0){
      vec2 pos = vec2(sin(a*k1+ph1)*0.36*asp, cos(a*k2+ph2)*0.34);
      float r = uSize*0.05*(0.6 + 0.8*h(fi+5.0));
      float d = length(p-pos);
      c += col*(exp(-d*d/(r*r))*1.6 + 0.06*exp(-d/(r*1.2)));
    } else if(uStyle==1){
      float tilt = -0.5 + h(fi+6.0)*0.35;
      float y = p.y*cos(tilt) - p.x*sin(tilt);
      float cy = sin(a*k1+ph1)*0.42;
      float w = uSize*0.007*(0.5 + h(fi+7.0));
      float d = abs(y-cy);
      float along = 0.55 + 0.45*sin(p.x*2.2 + a*k2 + ph2);
      c += col*(exp(-d*d/(w*w))*1.8 + 0.05*exp(-d/(w*5.0)))*along;
    } else if(uStyle==2){
      float cx = sin(a*k1+ph1)*0.42*asp;
      float w = uSize*0.01*(0.5 + h(fi+7.0));
      float d = abs(p.x - cx + p.y*0.15*sin(a*k2+ph2));
      float fade = exp(-p.y*p.y*1.2);
      c += col*(exp(-d*d/(w*w))*1.8 + 0.05*exp(-d/(w*5.0)))*fade;
    } else if(uStyle==3){
      vec2 ctr = vec2(sin(a*k1+ph1), cos(a*k2+ph2))*0.08;
      float r = uSize*(0.1 + 0.07*fi)*(1.0 + 0.12*sin(a*k2+ph1));
      float w = uSize*0.005*(0.6 + h(fi+7.0));
      float d = abs(length(p-ctr) - r);
      c += col*(exp(-d*d/(w*w))*1.8 + 0.05*exp(-d/(w*5.0)));
    } else {
      float y = p.y - (fi/max(uCount-1.0,1.0) - 0.5)*0.5
              - 0.12*sin(p.x*(2.0+h(fi+8.0)*2.0) + a*k1 + ph1)
              - 0.05*sin(p.x*5.0 - a*k2 + ph2);
      float w = uSize*0.008*(0.5 + h(fi+7.0));
      c += col*(exp(-y*y/(w*w))*1.6 + 0.05*exp(-abs(y)/(w*5.0)));
    }
  }
  c *= uBright;
  c = 1.0 - exp(-c*1.2);
  gl_FragColor = vec4(uBg + c*(1.0 - uBg), 1.0);
}`;

// Pass 2: cast wave glass blocks refracting whatever is in uTex.
const FS_GLASS = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uCover;
uniform float uFlip, uCell, uZoom, uRefract, uFrost, uChroma, uHighlight, uShine, uSheen, uReact,
              uLight, uEdgeDark, uGrain, uTime, uGap, uRim, uWave, uWaveScale, uWaveTwist, uCrease, uMoldVar;
uniform vec3 uGrout;
uniform int uAA;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.,0.)), u.x), mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), u.x), u.y);
}
float fbm(vec2 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<3;i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; }
  return s;
}
vec3 src(vec2 px){
  vec2 uv = (px/uRes - 0.5)*uCover + 0.5;
  uv = clamp(uv, vec2(0.0005), vec2(0.9995));
  if(uFlip > 0.5) uv.y = 1.0 - uv.y;
  return texture2D(uTex, uv).rgb;
}
// one block: rounded rim around the edge, flowing wave pattern pressed into the face
float waveH(vec2 b, vec2 seed){
  vec2 d = clamp(min(b, 1.0-b), 0.0, 1.0);
  vec2 t = clamp(d/max(uRim, 0.001), 0.0, 1.0);
  vec2 rv = sqrt(1.0 - (1.0-t)*(1.0-t));
  float rim = rv.x*rv.y;
  vec2 p = b*uWaveScale + seed;
  vec2 w = vec2(fbm(p + vec2(3.1,7.7)), fbm(p + vec2(8.3,2.8)));
  float n = fbm(p + (w-0.5)*uWaveTwist*3.0);
  n = mix(n, 1.0 - abs(2.0*n - 1.0), uCrease);
  float inner = smoothstep(0.0, 1.0, min(t.x, t.y));
  return rim*0.5 + n*uWave*0.35*inner;
}

vec3 shadeAt(vec2 p){
  vec2 q = p - 0.5*uRes + 0.5*uCell;          // a block sits centred in the frame
  vec2 cell = floor(q/uCell), f = fract(q/uCell);
  float g8 = uGap*0.5;
  vec2 b = (f - g8)/(1.0 - uGap);
  if(b.x < 0.0 || b.y < 0.0 || b.x > 1.0 || b.y > 1.0){
    float dE = length(b - clamp(b, 0.0, 1.0)) / max(g8/(1.0-uGap), 1e-4);
    return uGrout*(0.85 + 0.3*vnoise(q*0.45) + 0.15*(hash(floor(q*0.7))-0.5))*(0.7 + 0.3*smoothstep(0.0, 0.7, dE));
  }
  vec2 seed = (vec2(hash(cell + 1.7), hash(cell + 9.2)) - 0.5) * uMoldVar * 12.0;
  float e8 = 0.004;
  float h0 = waveH(b, seed);
  vec2 grad = vec2(waveH(b + vec2(e8,0.), seed) - h0, waveH(b + vec2(0.,e8), seed) - h0) / e8 * 0.25;
  grad /= 1.0 + length(grad)*0.12;
  grad += (vec2(hash(cell + 11.1), hash(cell + 23.7)) - 0.5) * uMoldVar * 0.4;

  vec2 off = (f-0.5)*uCell*(uZoom-1.0) - grad*uRefract*uCell*0.5;

  vec3 col = vec3(0.0);
  float rnd = hash(p + fract(uTime)*17.0)*6.2831;
  int n = uFrost > 0.01 ? 12 : 1;
  for(int i=0;i<12;i++){
    if(i>=n) break;
    float fi = float(i);
    float r = sqrt((fi+0.5)/12.0)*uFrost;
    float a = fi*2.39996 + rnd;
    vec2 bp = p + vec2(cos(a),sin(a))*r;
    col.r += src(bp + off*(1.0+uChroma)).r;
    col.g += src(bp + off).g;
    col.b += src(bp + off*(1.0-uChroma)).b;
  }
  col /= float(n);

  // glints are strongest where light comes through the glass
  float lum = dot(col, vec3(0.299,0.587,0.114));
  float pick = uSheen + lum*uReact*1.8;
  vec3 N = normalize(vec3(-grad*0.7, 1.0));
  vec3 L = normalize(vec3(cos(uLight), sin(uLight), 1.1));
  col *= 1.0 + (dot(N,L) - L.z)*0.3*(0.5+lum);
  float spec = pow(max(dot(reflect(-L,N), vec3(0.,0.,1.)), 0.0), uShine);
  vec3 sCol = mix(vec3(1.0), clamp(col/(lum+0.05)*0.7, 0.0, 1.5), 0.35);
  col += spec*uHighlight*pick*sCol;

  float ed = max(abs(b.x*2.0-1.0), abs(b.y*2.0-1.0));
  col *= 1.0 - smoothstep(0.95, 1.0, ed)*uEdgeDark;
  col += (hash(p*1.37 + fract(uTime)*31.0) - 0.5)*uGrain;
  return col;
}

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 c;
  if(uAA==1){
    c = 0.25*(shadeAt(p + vec2(-0.25,-0.25)) + shadeAt(p + vec2(0.25,-0.25))
            + shadeAt(p + vec2(-0.25, 0.25)) + shadeAt(p + vec2(0.25, 0.25)));
  } else c = shadeAt(p);
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

function program(fs){
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const pr = gl.createProgram();
  gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'a');
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const U = {}, n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const u = gl.getActiveUniform(pr, i); U[u.name] = gl.getUniformLocation(pr, u.name); }
  return {pr, U};
}
const lightProg = program(FS_LIGHT);
const glassProg = program(FS_GLASS);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeTex(){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const mediaTex = makeTex();
const lightTex = makeTex();
const fbo = gl.createFramebuffer();
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

/* ---------------- sources ---------------- */
const video = document.createElement('video');
video.playsInline = true; video.loop = true;
let source = {kind:'light', el:null, w:1080, h:1920};

function setSource(kind, el, w, h, name){
  source = {kind, el, w, h};
  $('srcName').textContent = name;
  $('backToLight').hidden = kind === 'light';
  if (kind !== 'video') video.pause();
  if (kind === 'image') uploadMedia();
  resize();
  setStatus(kind==='video' ? `${w}×${h} video · ${video.duration.toFixed(1)}s` : kind==='image' ? `${w}×${h} image` : 'Generated light · seamless loop');
}
function loadFile(file){
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')){
    const im = new Image();
    im.onload = () => setSource('image', im, im.naturalWidth, im.naturalHeight, file.name);
    im.onerror = () => setStatus('Could not read that image.');
    im.src = url;
  } else {
    video.onloadeddata = () => { setSource('video', video, video.videoWidth, video.videoHeight, file.name); video.play().catch(()=>{}); };
    video.onerror = () => setStatus('This browser cannot decode that video. Try MP4 (H.264) or WebM.');
    video.src = url; video.load();
  }
}
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('backToLight').onclick = () => setSource('light', null, 1080, 1920, 'Optional. The glass works on any footage too.');
let paused = false;
$('playpause').onclick = () => {
  paused = !paused;
  if (source.kind==='video'){ paused ? video.pause() : video.play(); }
  $('playpause').textContent = paused ? 'Play' : 'Pause';
};
const stage = $('stage');
['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('drag'); }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

/* ---------------- sizing ---------------- */
let cover = [1,1];
function resize(){
  const [W,H] = P.size.split('x').map(Number);
  canvas.width = W; canvas.height = H;
  gl.bindTexture(gl.TEXTURE_2D, lightTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, lightTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const sa = source.kind==='light' ? W/H : source.w/source.h, oa = W/H;
  cover = sa > oa ? [oa/sa, 1] : [1, sa/oa];
}
function uploadMedia(){
  const el = source.el;
  if (!el || (el instanceof HTMLVideoElement && el.readyState < 2)) return;
  gl.bindTexture(gl.TEXTURE_2D, mediaTex);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, el); } catch(e){}
}

/* ---------------- render loop ---------------- */
let last = performance.now(), clock = 0;
const rgb = h => { const n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };
const MORTAR_COL = [null, '#0b0b0c', '#cfc6b4'];

function frame(now){
  const dt = Math.min(0.1, (now-last)/1000); last = now;
  if (!offline){
    if (!paused) clock += dt;
    render();
    if (rec) updateRecProgress();
  }
  requestAnimationFrame(frame);
}

function render(){
  const W = canvas.width, H = canvas.height;
  let tex, flip;

  if (source.kind === 'light'){
    const {pr, U} = lightProg;
    gl.useProgram(pr);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0,0,W,H);
    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uPhase, (clock / P.duration) * P.speed * Math.PI * 2);
    gl.uniform1f(U.uSize, P.lsize);
    gl.uniform1f(U.uBright, P.bright);
    gl.uniform1f(U.uCount, P.count);
    gl.uniform1i(U.uStyle, P.style);
    gl.uniform3fv(U.uColA, rgb(P.colA));
    gl.uniform3fv(U.uColB, rgb(P.colB));
    gl.uniform3fv(U.uBg, rgb(P.bg));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    tex = lightTex; flip = 1;
  } else {
    if (source.kind === 'video') uploadMedia();
    tex = mediaTex; flip = 0;
  }

  const {pr, U} = glassProg;
  gl.useProgram(pr);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uCover, cover[0], cover[1]);
  gl.uniform1f(U.uFlip, flip);
  gl.uniform1f(U.uCell, P.cell * W / 1080);   // block size scales with output width
  gl.uniform1f(U.uZoom, P.zoom);
  gl.uniform1f(U.uRefract, P.refract);
  gl.uniform1f(U.uFrost, P.frost * W / 1080);
  gl.uniform1f(U.uChroma, P.chroma);
  gl.uniform1f(U.uHighlight, P.highlight);
  gl.uniform1f(U.uShine, P.shine);
  gl.uniform1f(U.uSheen, P.sheen);
  gl.uniform1f(U.uReact, P.react);
  gl.uniform1f(U.uLight, P.lightAng*Math.PI/180);
  gl.uniform1f(U.uEdgeDark, P.edgeDark);
  gl.uniform1f(U.uGrain, P.grain);
  gl.uniform1f(U.uTime, clock);
  gl.uniform1f(U.uGap, P.mortar === 0 ? 0 : P.gap);
  gl.uniform3fv(U.uGrout, rgb(MORTAR_COL[P.mortar] || '#000000'));
  gl.uniform1f(U.uRim, P.rim);
  gl.uniform1f(U.uWave, P.wave);
  gl.uniform1f(U.uWaveScale, P.waveScale);
  gl.uniform1f(U.uWaveTwist, P.waveTwist);
  gl.uniform1f(U.uCrease, P.crease);
  gl.uniform1f(U.uMoldVar, P.moldVar);
  gl.uniform1i(U.uAA, P.aa ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------------- export ---------------- */
function setStatus(t){ $('status').textContent = t; }
function pickMime(){
  if (typeof MediaRecorder === 'undefined') return null;
  const mp4 = ['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1','video/mp4'];
  const webm = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const order = P.format==='webm' ? webm.concat(mp4) : mp4.concat(webm);
  return order.find(m => MediaRecorder.isTypeSupported(m)) || null;
}
function updateFormatNote(){
  const m = pickMime();
  $('fmtNote').textContent = m
    ? (canOffline() && P.format !== 'webm'
        ? 'Generated light renders frame by frame to MP4 and loops seamlessly over the length above. Your own videos record in real time, start to end.'
        : `Exports ${m.split(';')[0].replace('video/','').toUpperCase()} in real time. Generated light loops seamlessly over the length above.`)
    : 'Video recording is not supported in this browser. PNG export still works.';
}

let audioCtx = null, audioDest = null;
function videoAudioTrack(){
  try {
    if (!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const node = audioCtx.createMediaElementSource(video);
      audioDest = audioCtx.createMediaStreamDestination();
      node.connect(audioDest); node.connect(audioCtx.destination);
    }
    audioCtx.resume();
    return audioDest.stream.getAudioTracks()[0] || null;
  } catch(e){ return null; }
}

// Generated light renders frame by frame with exact timestamps (WebCodecs + MP4 muxer),
// so the clip is smooth and loops perfectly however slow the computer is.
let offline = null;
const canOffline = () => typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined' && typeof Mp4Muxer !== 'undefined';
async function pickAvc(W, H, fps){
  for (const codec of ['avc1.640034','avc1.640033','avc1.640028','avc1.4d0034','avc1.42003e']){
    const cfg = {codec, width:W, height:H, bitrate:+P.bitrate*1e6, framerate:fps};
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch(e){}
  }
  return null;
}
async function renderOffline(){
  const W = canvas.width, H = canvas.height, fps = +P.fps, total = Math.round(P.duration*fps);
  const cfg = await pickAvc(W, H, fps);
  if (!cfg) return false;
  const muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc', width:W, height:H, frameRate:fps}, fastStart:'in-memory'});
  let failed = null;
  const enc = new VideoEncoder({output:(chunk, meta) => muxer.addVideoChunk(chunk, meta), error:e => { failed = e; }});
  enc.configure(cfg);
  offline = {cancel:false};
  setRecordingUI(true);
  const saved = clock;
  for (let i = 0; i < total && !offline.cancel && !failed; i++){
    clock = i / fps;
    render();
    const vf = new VideoFrame(canvas, {timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps)});
    enc.encode(vf, {keyFrame: i % (fps*2) === 0});
    vf.close();
    $('progress').firstElementChild.style.width = ((i+1)/total*100) + '%';
    $('status').innerHTML = `<span class="rec-dot"></span>Rendering frame ${i+1} / ${total}`;
    while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5));
    await new Promise(r => setTimeout(r, 0));
  }
  const cancelled = offline.cancel;
  if (!failed && !cancelled){ await enc.flush(); muxer.finalize(); }
  try { enc.close(); } catch(e){}
  offline = null; clock = saved;
  setRecordingUI(false);
  if (failed){ setStatus('Encoding failed: ' + failed.message); return true; }
  if (cancelled){ setStatus('Export cancelled.'); return true; }
  offerFile(new Blob([muxer.target.buffer], {type:'video/mp4'}), `glass-blocks-${Date.now()}.mp4`);
  return true;
}
function setRecordingUI(on){
  $('rec').textContent = on ? 'Stop' : 'Export video';
  $('rec').classList.toggle('primary', !on); $('rec').classList.toggle('danger', on);
  $('progress').hidden = !on;
  if (!on) $('progress').firstElementChild.style.width = '0';
  document.querySelectorAll('#c_size,#c_fps,#c_format,#c_bitrate,#c_duration').forEach(e => e.disabled = on);
}

let rec = null;
async function startRecording(){
  if (source.kind !== 'video' && P.format !== 'webm' && canOffline()){
    if (await renderOffline()) return;
  }
  const mime = pickMime();
  if (!mime){ setStatus('Recording is not supported in this browser.'); return; }
  const stream = canvas.captureStream(+P.fps);
  const isVideo = source.kind === 'video';
  if (isVideo){ const at = videoAudioTrack(); if (at) stream.addTrack(at); }
  const chunks = [];
  const mr = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:+P.bitrate*1e6, audioBitsPerSecond:192000});
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const type = mime.split(';')[0];
    endRecordingUI();
    offerFile(new Blob(chunks, {type}), `glass-blocks-${Date.now()}.${type.includes('mp4')?'mp4':'webm'}`);
  };
  rec = {mr, isVideo, start: performance.now(), dur: isVideo ? video.duration : P.duration};
  paused = false; $('playpause').textContent = 'Pause';
  if (isVideo){
    video.loop = false; video.pause();
    await new Promise(r => { video.onseeked = () => { video.onseeked = null; r(); }; video.currentTime = 0; });
    video.onended = () => stopRecording();
    mr.start(250);
    await video.play();
  } else {
    clock = 0;                      // start the loop from its first frame
    mr.start(250);
    rec.timer = setTimeout(stopRecording, P.duration*1000);
  }
  setRecordingUI(true);
}
function stopRecording(){
  if (!rec) return;
  clearTimeout(rec.timer);
  video.onended = null;
  if (rec.mr.state !== 'inactive') rec.mr.stop();
  if (rec.isVideo){ video.loop = true; video.play().catch(()=>{}); }
}
function endRecordingUI(){
  rec = null;
  setRecordingUI(false);
}
function updateRecProgress(){
  const t = rec.isVideo ? video.currentTime : (performance.now()-rec.start)/1000;
  $('progress').firstElementChild.style.width = Math.min(100, t/rec.dur*100) + '%';
  $('status').innerHTML = `<span class="rec-dot"></span>Recording ${t.toFixed(1)} / ${rec.dur.toFixed(1)}s`;
}
$('rec').onclick = () => { if (offline) offline.cancel = true; else if (rec) stopRecording(); else startRecording(); };
$('snap').onclick = () => canvas.toBlob(b => offerFile(b, `glass-blocks-${Date.now()}.png`), 'image/png');

// Inside a claude.ai artifact, files go through the viewer's save prompt; standalone, a normal download.
let lastExport = null;
async function offerFile(blob, filename){
  lastExport = {blob, filename};
  const mb = (blob.size/1048576).toFixed(1);
  let dl = null;
  if (window.claude && window.claude.use){ try { dl = await window.claude.use('downloads'); } catch(e){} }
  if (dl){
    $('resave').hidden = false;
    try { await dl.save({filename, data: blob}); setStatus(`Saved ${filename} (${mb} MB)`); }
    catch(err){
      setStatus(err && err.code === 'declined' ? 'Save cancelled. Use "Save last export again" to retry.'
        : `Could not save the file (${err && (err.code || err.message)}).`);
    }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(`Saved ${filename} (${mb} MB)`);
  }
}
$('resave').onclick = () => { if (lastExport) offerFile(lastExport.blob, lastExport.filename); };

/* ---------------- go ---------------- */
buildControls();
updateFormatNote();
resize();
requestAnimationFrame(frame);
window.__glass = {P, setParam, loadFile};
})();
</script>
</body>
</html>
